name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- server ---
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Start server
        working-directory: server
        env:
          PORT: 3000
          SMS_PROVIDER: none
          DEMO_SEED: "true"
        run: |
          node src/index.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done

      - name: API + signalling end-to-end test
        working-directory: server
        run: node test/e2e.mjs http://127.0.0.1:3000

      - name: Server log
        if: always()
        run: tail -40 /tmp/server.log

  # ----------------------------------------------------------- encryption ---
  crypto-and-client-tests:
    name: Encryption + client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Android crypto against the RFC 7748 / RFC 5869 vectors
        run: |
          node test/gen-crypto-vectors.mjs > test/crypto-vectors.json
          python3 test/verify-crypto.py

      - name: Web crypto engine
        run: node test/e2ee-web.mjs

      - name: Web <-> Android protocol compatibility
        run: node test/e2ee-cross.mjs

      - name: TextBee SMS provider (offline, fetch is stubbed)
        run: node test/sms-textbee.mjs

      - name: Real signup and messaging with personal numbers
        run: node test/real-signup.mjs

      - name: End-to-end (encryption, shared wallpaper, capture notices)
        working-directory: server
        env:
          PORT: 3000
          SMS_PROVIDER: none
          DEMO_SEED: "true"
        run: |
          node src/index.js > /tmp/server2.log 2>&1 &
          echo $! > /tmp/server2.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          cd ..
          node test/e2ee-live.mjs
          cd test && npm install --no-save --no-audit --no-fund jsdom esbuild && cd ..
          node test/web-two-clients.mjs http://127.0.0.1:3000
          kill $(cat /tmp/server2.pid) || true

      - name: Server log
        if: always()
        run: tail -40 /tmp/server2.log

  # --------------------------------------------------------------- web ui ---
  web-ui-test:
    name: Web UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsdom + esbuild
        working-directory: test
        run: npm install --no-save --no-audit --no-fund jsdom esbuild

      - name: Start server
        working-directory: server
        env:
          PORT: 3000
          SMS_PROVIDER: none
          DEMO_SEED: "true"
        run: |
          node src/index.js > /tmp/server3.log 2>&1 &
          echo $! > /tmp/server3.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done

      - name: Render the web client headless
        run: node test/web-smoke.mjs http://127.0.0.1:3000

      - name: Server log
        if: always()
        run: tail -40 /tmp/server3.log

  # --------------------------------------------------------------- android ---
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Generate the Gradle wrapper (handy for local builds)
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Compile (Kotlin)
        working-directory: android
        run: gradle :app:compileDebugKotlin --stacktrace 2>&1 | tee /tmp/kotlin.log

      - name: Upload the compiler log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-build-log
          path: /tmp/kotlin.log

      - name: Build release APK (single file, Android 8+)
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect the single APK and verify the count
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ || true
          count=$(ls out/*.apk 2>/dev/null | wc -l)
          ls -la out
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 apk, found $count"
            exit 1
          fi

      - name: Upload the APK (single file)
        uses: actions/upload-artifact@v4
        with:
          name: masingar-apk
          path: out/*.apk

      - name: Upload Gradle wrapper (copy into android/ for offline builds)
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
