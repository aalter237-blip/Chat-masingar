# Masingar - بناء APK عبر GitHub Actions
#
# ضع هذا الملف في: .github/workflows/main.yml   (أو أي اسم ينتهي بـ .yml داخل .github/workflows)
#
# بعد التجميع يظهر ملف APK واحد فقط (release) يعمل على Android 8+ (API 26) وكل المعماريات —
# لا يوجد تقسيم ABI في build.gradle.kts، فالمخرى: app-release.apk فقط.
#
# لماذا لا يصلح ملف «Set up JDK 17» العادي؟
#   1. `cache: gradle` يبحث عن أي ملف **/*.gradle* في جذر المستودع، ومشروعنا
#      داخل مجلد android/ فيفشل برسالة:
#      Error: No file ... matched to [**/*.gradle*,**/gradle-wrapper.properties]
#   2. `chmod +x gradlew` و `./gradlew ...` يفترضان أن مشروع الأندرويد في الجذر،
#      بينما هو في android/ والمستودع لا يحتوي أصلاً على gradlew.
#   هذا الملف يعالج الأمرين: بلا كاش، وينصّب Gradle 8.9 ثم يبني من داخل android/.

name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # تشغيل يدوي من تبويب Actions

jobs:
  build:
    name: Build single Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android      # ← مشروع الأندرويد في مجلد فرعي

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # بدون cache: gradle - هو سبب الخطأ السابق

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build Release APK (single file, Android 8+)
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        continue-on-error: true         # إن لم تُضبط keystore يُوقَّع بمفتاح التطوير

      - name: Verify exactly one APK was produced
        run: |
          shopt -s nullglob
          apks=( app/build/outputs/apk/release/*.apk )
          echo "APKs found: ${#apks[@]}"
          for a in "${apks[@]}"; do echo " - $a"; done
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 apk, found ${#apks[@]}"
            exit 1
          fi

      - name: Upload the APK (single file)
        uses: actions/upload-artifact@v4
        with:
          name: Masingar.apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
