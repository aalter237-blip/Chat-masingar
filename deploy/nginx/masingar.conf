# Reverse proxy for the Masingar server (HTTP/2, WebSocket upgrade, uploads).
#
# Put your certificates in ./certs/fullchain.pem and ./certs/privkey.pem
# (a free Let's Encrypt certificate works fine).

upstream masingar {
    server masingar:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # uploads can be large
    client_max_body_size 64m;

    # WebSocket signalling
    location /ws {
        proxy_pass http://masingar;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://masingar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://masingar;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }
}
