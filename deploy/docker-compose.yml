# ماسنجر لايت — سيرفر واحد صغير فقط (لا coturn ولا خدمات إضافية)
services:
  masingar:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_NAME: ماسنجر لايت
      MAX_MEMBERS: "5"          # حد الدائرة
      JOIN_CODE: ""             # اضبطه (مثلاً 4521) ليُطلب من كل عضو جديد عند التسجيل
      # MAX_MESSAGES: "1000"    # أرشيف الرسائل (يُقلَّم تلقائياً — مساحة صغيرة دائماً)
      # MAX_POSTS: "200"        # أرشيف المنشورات
    volumes:
      - masingar-data:/data

volumes:
  masingar-data:
