# Minimal, production ready coturn configuration for Masingar.
# Relays are what make calls work behind symmetric NAT, carrier grade NAT,
# hotel Wi-Fi and 2G/3G proxies - do not skip this component.

listening-port=3478
tls-listening-port=5349
# port 443 on TCP is the last resort for very restrictive networks
alt-tls-listening-port=443
alt-listening-port=3479

listening-ip=0.0.0.0
# Replace with your public IP (or use `external-ip=$(detect-external-ip)`)
external-ip=REPLACE_WITH_PUBLIC_IP
realm=masingar

# Time limited credentials: the app server signs them with the same secret
use-auth-secret
static-auth-secret=REPLACE_WITH_A_LONG_RANDOM_SECRET

fingerprint
lt-cred-mech
no-multicast-peers
no-loopback-peers
no-cli
no-tlsv1
no-tlsv1_1

# TLS certificates (needed for turns: and the TCP 443 fallback)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay ports
min-port=49152
max-port=65535

# Fair use limits
user-quota=12
total-quota=200
stale-nonce=600
# cap every relayed stream at ~1.5 Mbit/s (plenty for 720p)
max-bps=1500000
bps-capacity=0

# Logs
log-file=stdout
simple-log
verbose
